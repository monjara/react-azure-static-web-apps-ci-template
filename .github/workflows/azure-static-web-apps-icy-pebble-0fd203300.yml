name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop

concurrency:
  group: azure-static-web-apps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: return await core.getIDToken()
          result-encoding: string

      # pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_BOOL: ${{ vars.VITE_BOOL }}
          VITE_TEXT: ${{ vars.VITE_TEXT }}
        run: pnpm build

      # Azure Static Web Apps
      - name: Deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_PEBBLE_0FD203300 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          # distはすでにpnpmでビルド済み
          app_location: "dist" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "/" # Built app content directory - optional
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          production_branch: "develop"
          ###### End of Repository/Build Configurations ######

      - name: Show preview URL
        run: echo "${{ steps.deploy.outputs.static_web_app_url }}"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: return await core.getIDToken()
          result-encoding: string

      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_PEBBLE_0FD203300 }}
          action: "close"
          github_id_token: ${{ steps.idtoken.outputs.result }}
